[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-guard"
version = "1.0.1"
description = "Keep one local LLM in VRAM. Stop the rest."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ironeye11-bot" }]
keywords = ["ollama", "vram", "llm", "gpu", "local-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
gpu-guard = "gpu_guard.cli:main"

[project.urls]
Homepage = "https://github.com/ironeye11-bot/gpu-guard"
Issues = "https://github.com/ironeye11-bot/gpu-guard/issues"

[tool.setuptools.packages.find]
where = ["src"]
