name: Publish v1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.0.0             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "v1.0.0"             --notes "Ein Ollama-Modell im VRAM. ps, only, stop, stop-all. Kein Pull, kein Server, keine Telemetrie."
