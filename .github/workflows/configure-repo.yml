name: Configure repository metadata

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo edit "$GITHUB_REPOSITORY" --description "Ein lokales LLM im VRAM. Der Rest fliegt runter." --enable-issues=true --enable-wiki=false --enable-projects=false --add-topic ollama --add-topic gpu --add-topic vram --add-topic llm --add-topic cli --add-topic python
